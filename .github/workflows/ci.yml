name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job raises it for itself only.
permissions:
  contents: read

env:
  IMAGE_NAME: devops-intern-final

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # Pinned by digest to the exact hadolint 2.15.1 image used locally
      - name: Hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            < app/Dockerfile
