name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read

env:
  IMAGE_NAME: devops-intern-final

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      
      - name: Hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            < app/Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t "$IMAGE_NAME:ci" app
          docker images "$IMAGE_NAME:ci"

      - name: Save image for later jobs
        run: docker save "$IMAGE_NAME:ci" -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load and start container
        run: |
          docker load -i image.tar
          docker run -d --name web -p 8080:8080 "$IMAGE_NAME:ci"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "container never became ready" >&2
          exit 1

      - name: Health check (fails the job if not 200)
        run: |
          ./scripts/healthcheck.sh http://localhost:8080/
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Show container logs on failure
        if: failure()
        run: docker logs web
